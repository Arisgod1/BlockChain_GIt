<!DOCTYPE html>
<html>
<head>
    <title>首页</title>
</head>
<body>
    <h2>欢迎, {{ name }}!</h2>
    <p>您已成功登录系统。</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <a href="{{ url_for('logout') }}">退出登录</a>
</body>
</html>
